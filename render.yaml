    name: code-hunt-uptime-ping
    runtime: node
    buildCommand: npm install
    startCommand: node -e "setInterval(() => { require('https').get('https://code-hunt-backend-XXXX.onrender.com/api/health', r => console.log('ping')); }, 300000);"
